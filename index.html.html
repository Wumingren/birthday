<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 19th Birthday 刘柯莹</title>
    <style>
        /* 全局样式与暗黑甜酷氛围 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(circle at center, #2d113d 0%, #0f0518 100%);
            color: #fff;
        }

        /* 画面切换控制 */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease, transform 1.2s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* 画面一：密码弹窗 */
        #scene1 {
            background: rgba(15, 5, 24, 0.95);
            z-index: 100;
        }
        .modal {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 45px;
            border-radius: 24px;
            border: 1px solid rgba(255, 182, 235, 0.2);
            box-shadow: 0 10px 40px rgba(138, 43, 226, 0.2);
            text-align: center;
            width: 340px;
        }
        .modal h2 {
            margin: 0 0 25px 0;
            font-size: 26px;
            background: linear-gradient(45deg, #ffb6e1, #b06ab3);
            -webkit-background-clip: text;
            color: transparent;
        }
        .modal input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
            text-align: center;
        }
        .modal .hint {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        .modal button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            margin: 0 8px;
        }
        .btn-confirm {
            background: linear-gradient(45deg, #b06ab3, #4568dc);
            color: #fff;
            box-shadow: 0 4px 15px rgba(176, 106, 179, 0.4);
        }
        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: #ddd;
        }
        .btn-confirm:hover { transform: scale(1.05); box-shadow: 0 0 20px #b06ab3; }
        .error-msg { color: #ff99cc; font-size: 14px; margin-top: -5px; margin-bottom: 10px; height: 14px;}

        /* 画面二：气泡与爱心 */
        #scene2 {
            flex-direction: column;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            opacity: 0;
            transform: scale(0.5) translate(0, 80px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        .bubble.show {
            opacity: 1;
            transform: scale(1) translate(var(--tx), var(--ty));
        }
        .scroll-hint {
            position: absolute;
            bottom: 50px;
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            animation: bounce 2s infinite;
            opacity: 0;
            transition: opacity 1.5s;
            z-index: 20;
            text-shadow: 0 0 10px #b06ab3;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* 画面三：实字与光粒子背景 */
        #scene3 {
            background: radial-gradient(circle at center, #3b1c59 0%, #0f0518 100%);
            flex-direction: column;
        }
        .text-layer {
            position: absolute;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        .text-layer h1 {
            font-size: 50px;
            margin: 0 0 20px 0;
            background: linear-gradient(45deg, #fff, #ffb6e1);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,182,225,0.5);
        }
        .text-layer h2 {
            font-size: 30px;
            margin: 0 0 30px 0;
            color: #e6c3ff;
            font-weight: normal;
        }
        .text-layer p {
            font-size: 22px;
            margin: 0;
            color: #ffd700;
            letter-spacing: 4px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* 光粒子在文字下方 */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 画面一：密码验证 -->
    <div id="scene1" class="scene">
        <div class="modal">
            <h2>刘柯莹</h2>
            <input type="password" id="pwdInput" placeholder="请输入密码" autocomplete="off">
            <div class="hint">为你的生日，4位数</div>
            <div class="error-msg" id="errorMsg"></div>
            <button class="btn-cancel" onclick="handleCancel()">取消</button>
            <button class="btn-confirm" onclick="handleConfirm()">确定</button>
        </div>
    </div>

    <!-- 画面二：祝福气泡 -->
    <div id="scene2" class="scene hidden">
        <div id="bubbleContainer"></div>
        <div id="scrollHint" class="scroll-hint">✨ 请手动上滑解锁惊喜 ✨</div>
    </div>

    <!-- 画面三：实字与光粒子背景 -->
    <div id="scene3" class="scene hidden">
        <canvas id="particleCanvas"></canvas>
        <div class="text-layer">
            <h1>刘柯莹</h1>
            <h2>Happy 19th Birthday</h2>
            <p>天天开心，睡个好觉</p>
        </div>
    </div>

<script>
    // ================= 画面一逻辑 =================
    const pwdInput = document.getElementById('pwdInput');
    const errorMsg = document.getElementById('errorMsg');

    function handleConfirm() {
        if (pwdInput.value === '0919') {
            document.getElementById('scene1').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('scene2').classList.remove('hidden');
                startBubbles();
            }, 1200);
        } else {
            errorMsg.textContent = '密码错误，再试一次哦~';
            pwdInput.value = '';
            pwdInput.focus();
        }
    }

    function handleCancel() {
        alert('密码不对的话，礼物就看不到啦！');
        pwdInput.focus();
    }

    pwdInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleConfirm();
    });

    // ================= 画面二逻辑 =================
    const wishes = [
        "十九岁生日快乐", "愿你天天开心", "今晚睡个好觉", 
        "永远闪闪发光", "好运正在派送", "保持可爱满分", 
        "万事皆能胜意", "岁岁平安喜乐", "前程一路生花", 
        "烦恼全部退散", "快乐超级加倍", "幸福紧紧包围", 
        "做个甜酷女孩", "永远十八岁呀", "吃好喝好不长胖", 
        "每天都被偏爱", "美梦正在发生", "星光为你闪烁", 
        "未来闪闪发亮", "好运正在降临", "无忧无虑长大", 
        "笑容永远灿烂", "被世界温柔爱", "可爱永不打烊", 
        "永远充满元气", "好运爆棚啦呀", "烦恼统统消失", 
        "快乐没有尽头", "幸福永远满格", "十九岁超快乐"
    ];

    function getHeartPoints(count, centerX, centerY, scale) {
        const points = [];
        for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            points.push({ x: centerX + x * scale, y: centerY + y * scale });
        }
        return points;
    }

    function startBubbles() {
        const container = document.getElementById('bubbleContainer');
        const hint = document.getElementById('scrollHint');
        const w = window.innerWidth;
        const h = window.innerHeight;
        const heartPoints = getHeartPoints(30, w/2, h/2, Math.min(w, h) / 40);
        
        wishes.forEach((text, index) => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            
            const colors = [
                'linear-gradient(135deg, #ff7eb3 0%, #8a2be2 100%)',
                'linear-gradient(135deg, #b06ab3 0%, #ffd700 100%)',
                'linear-gradient(135deg, #da70d6 0%, #4b0082 100%)',
                'linear-gradient(135deg, #ff9a9e 0%, #9370db 100%)',
                'linear-gradient(135deg, #e6c3ff 0%, #b06ab3 100%)'
            ];
            bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
            container.appendChild(bubble);
            
            setTimeout(() => {
                const randX = (Math.random() - 0.5) * w * 0.8;
                const randY = (Math.random() - 0.5) * h * 0.8;
                bubble.style.setProperty('--tx', `${randX}px`);
                bubble.style.setProperty('--ty', `${randY}px`);
                bubble.classList.add('show');
                
                setTimeout(() => {
                    const target = heartPoints[index];
                    bubble.style.setProperty('--tx', `${target.x - w/2}px`);
                    bubble.style.setProperty('--ty', `${target.y - h/2}px`);
                    bubble.style.zIndex = index;
                }, 800);
                
                if (index === wishes.length - 1) {
                    setTimeout(() => {
                        hint.style.opacity = '1';
                        enableScrollToScene3();
                    }, 2000);
                }
            }, index * 300); 
        });
    }

    function enableScrollToScene3() {
        let scrollCooldown = false;
        const handler = (e) => {
            if (scrollCooldown) return;
            if (e.type === 'wheel' && e.deltaY > 30) triggerScene3();
            else if (e.type === 'touchmove' && e.touches[0].clientY < window.innerHeight * 0.8) triggerScene3();
        };

        const triggerScene3 = () => {
            scrollCooldown = true;
            document.getElementById('scene2').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('scene3').classList.remove('hidden');
                initParticles();
            }, 1200);
        };

        window.addEventListener('wheel', handler);
        window.addEventListener('touchmove', handler);
    }

    // ================= 画面三逻辑：独立光粒子背景 =================
    function initParticles() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class FloatingParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 3 + 2;
                this.speedX = (Math.random() - 0.5) * 0.8; // 来回飘荡的速度
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.6 + 0.2;
                const colors = ['#ffb6e1', '#e6c3ff', '#ffd700', '#da70d6'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                // 边界反弹，实现来回飘荡
                if (this.x < 0 || this.x > w) this.speedX *= -1;
                if (this.y < 0 || this.y > h) this.speedY *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 生成50个光粒子
        for (let i = 0; i < 50; i++) {
            particles.push(new FloatingParticle());
        }

        function animate() {
            ctx.clearRect(0, 0, w, h); // 完全清除，不留拖尾，保证文字清晰
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
</script>
</body>
</html>
